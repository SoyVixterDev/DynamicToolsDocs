  nameWithType: IDynamicText.RevealText(RevealAnimation, bool, bool)
  fullName: DynamicTools.DynamicTextFX.IDynamicText.RevealText(DynamicTools.DynamicTextFX.Reveals.RevealAnimation, bool, bool)
  type: Method
  assemblies:
  - DynamicTools.DynamicTextFX.Runtime
  namespace: DynamicTools.DynamicTextFX
  summary: Triggers a reveal animation for this text.
  example: []
  syntax:
    content: void RevealText(RevealAnimation overrideAnimation = RevealAnimation.None, bool stopCurrent = true, bool forceInEditor = false)
    parameters:
    - id: overrideAnimation
      type: DynamicTools.DynamicTextFX.Reveals.RevealAnimation
      description: If set to other than "none" ignores the default reveal animation and uses that one instead
    - id: stopCurrent
      type: System.Boolean
      description: If set to false, the animation won't play if there's another one already running
    - id: forceInEditor
      type: System.Boolean
    content.vb: Sub RevealText(overrideAnimation As RevealAnimation = RevealAnimation.None, stopCurrent As Boolean = True, forceInEditor As Boolean = False)
  overload: DynamicTools.DynamicTextFX.IDynamicText.RevealText*
